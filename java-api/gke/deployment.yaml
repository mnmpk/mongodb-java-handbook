apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
spec:
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
      - name: ${APP_NAME}
        image: gcr.io/${PROJECT_ID}/${REPO_NAME}-java:${TAG_NAME}
        imagePullPolicy: Always
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "scheduler,mongo-cache,mongo-session,change-stream"
        - name: DATABASE_PASSWORD
          value: "${DATABASE_PASSWORD}"
        - name: VOYAGE_AI_KEY
          value: "${VOYAGE_AI_KEY}"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
        - containerPort: 8081
        resources:
          limits:
            cpu: 900m
            memory: 1G
          requests:
            cpu: 800m
            memory: 800m
        livenessProbe:
          initialDelaySeconds: 50
          httpGet:
            path: /actuator/health
            port: 8081
        readinessProbe:
          initialDelaySeconds: 50
          httpGet:
            path: /actuator/health
            port: 8081
      - name: ${APP_NAME}-mcp
        image: mongodb/mongodb-mcp-server:latest
        imagePullPolicy: Always
        env:
        - name: MDB_MCP_CONNECTION_STRING
          value: "mongodb+srv://dev:${DATABASE_PASSWORD}@demo.uskpz.mongodb.net/"
        - name: MDB_MCP_TRANSPORT
          value: "http"
